name: Build IPA

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid zstd

      - name: Download Procursus bootstrap
        run: |
          if [ ! -f bootstrap.tar ]; then
            echo "[*] Downloading Procursus bootstrap..."
            curl -L -o /tmp/bootstrap.tar.zst \
              "https://apt.procurs.us/bootstraps/1900/bootstrap-iphoneos-arm64.tar.zst"
            zstd -d /tmp/bootstrap.tar.zst -c > bootstrap.tar
            echo "[+] Bootstrap downloaded ($(ls -lh bootstrap.tar | awk '{print $5}'))"
          fi

      - name: Download Sileo deb (rootless)
        run: |
          echo "[*] Downloading Sileo..."
          curl -L -o sileo.deb \
            "https://repo.getsileo.app/./pool/org.coolstar.sileo_2.5.1_iphoneos-arm64.deb" \
            --retry 3 --retry-delay 5 || echo "[-] Sileo download failed (build continues)"
          ls -lh sileo.deb 2>/dev/null || echo "[-] No sileo.deb"

      - name: Ad-hoc sign bootstrap + Sileo (Mach-O) so trust cache build has cdhashes
        run: |
          set -e
          sign_tree() {
            dir="$1"; tarout="$2"; signed=0
            echo "[*] Scanning $dir for Mach-O to sign..."
            while IFS= read -r -d '' f; do
              if file -b "$f" | grep -qi 'mach-o'; then
                if ldid -S "$f" 2>/dev/null; then
                  signed=$((signed+1))
                else
                  echo "  [!] ldid failed on $f"
                fi
              fi
            done < <(find "$dir" -type f -print0)
            echo "[+] Signed $signed binaries in $dir"
            tar -cf "$tarout" -C "$dir" .
            echo "[+] Repacked $tarout ($(ls -lh "$tarout" | awk '{print $5}'))"
          }

          rm -rf bs_tree sl_tree
          mkdir -p bs_tree sl_tree
          tar -xf bootstrap.tar -C bs_tree
          sign_tree bs_tree bootstrap.tar

          if [ -f sileo.deb ]; then
            rm -rf sx && mkdir -p sx && (cd sx && ar x ../sileo.deb)
            if [ -f sx/data.tar.xz ]; then
              tar -xJf sx/data.tar.xz -C sl_tree
              sign_tree sl_tree sileo.tar
            else
              echo "[-] data.tar.xz not found in sileo.deb"
            fi
            rm -rf sx
          fi

      - name: Build TrustCache from bootstrap + Sileo cdhashes
        run: |
          echo "[*] Building TrustCache..."
          python3 scripts/mk_tc.py \
            --out TrustCache \
            bootstrap.tar sileo.tar 2>&1 || echo "[-] mk_tc failed"
          ls -lh TrustCache || echo "[-] no TrustCache"

      - name: Stamp build version
        run: |
          echo "${GITHUB_SHA::7}" > version.txt
          echo "[+] version.txt: $(cat version.txt)"

      - name: Build ProjectSword (full — TrollStore)
        run: make CI=1 ipa && mv ProjectSword.ipa ProjectSword-full.ipa

      - name: Build ProjectSword (lite — ESign / cert signing)
        run: make CI=1 LITE=1 ipa && mv ProjectSword.ipa ProjectSword-lite.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSword-${{ github.ref_name }}
          path: |
            ProjectSword-full.ipa
            ProjectSword-lite.ipa

      - name: Create Release
        if: github.event.inputs.release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: ProjectSword ${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          files: |
            ProjectSword-full.ipa
            ProjectSword-lite.ipa
          make_latest: true


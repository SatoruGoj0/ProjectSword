name: Build IPA

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid zstd

      - name: Download Procursus bootstrap
        run: |
          if [ ! -f bootstrap.tar ]; then
            echo "[*] Downloading Procursus bootstrap..."
            curl -L -o /tmp/bootstrap.tar.zst \
              "https://apt.procurs.us/bootstraps/1900/bootstrap-iphoneos-arm64.tar.zst"
            zstd -d /tmp/bootstrap.tar.zst -c > bootstrap.tar
            echo "[+] Bootstrap downloaded ($(ls -lh bootstrap.tar | awk '{print $5}'))"
          fi

      - name: Build ProjectSword (full — TrollStore)
        run: make CI=1 ipa && mv ProjectSword.ipa ProjectSword-full.ipa

      - name: Build ProjectSword (lite — ESign / cert signing)
        run: make CI=1 LITE=1 ipa && mv ProjectSword.ipa ProjectSword-lite.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSword-${{ github.ref_name }}
          path: |
            ProjectSword-full.ipa
            ProjectSword-lite.ipa

      - name: Create Release
        if: github.event.inputs.release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: ProjectSword ${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          files: |
            ProjectSword-full.ipa
            ProjectSword-lite.ipa
          make_latest: true

  analyze-kernel:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew trust blacktop/tap
          brew install blacktop/tap/ipsw
          python3 -m pip install --break-system-packages pyimg4 requests || true

      - name: Download IPSW (8.9 GB)
        run: |
          IPSW_URL="https://updates.cdn-apple.com/2024FallFCS/fullrestores/072-56463/D18FEB94-3626-4074-80AD-D90F44E7D730/iPhone13,2,iPhone13,3_18.2.1_22C161_Restore.ipsw"
          echo "[*] Downloading IPSW (8.9 GB)..."
          curl -L -o /tmp/ipsw.zip "$IPSW_URL" --retry 3 --retry-delay 10 --progress-bar
          echo "[+] Downloaded $(ls -lh /tmp/ipsw.zip | awk '{print $5}')"
          df -h /tmp | tail -1

      - name: Extract kernelcache (ipsw extract --kernel, handles cryptex + key lookup)
        run: |
          echo "=== IPSW contents (kernelcache/cryptex files) ==="
          unzip -l /tmp/ipsw.zip | grep -iE "kernelcache|cryptex|\.aea" | head -20
          mkdir -p /tmp/kernel_out
          echo ""
          echo "=== Attempt 1: ipsw extract --kernel --lookup (cryptex + theapplewiki keys) ==="
          ipsw extract -k -l /tmp/ipsw.zip -o /tmp/kernel_out 2>&1 | tail -25 || echo "[-] ipsw extract --kernel failed"
          echo ""
          echo "=== Extracted files ==="
          find /tmp/kernel_out -type f -exec ls -lh {} \; 2>/dev/null || true
          echo ""
          echo "=== Attempt 2 (fallback): manual unzip of top-level kernelcache ==="
          if [ -z "$(find /tmp/kernel_out -type f 2>/dev/null)" ]; then
            unzip -o -j /tmp/ipsw.zip "kernelcache*" -d /tmp/kernel_out 2>&1 | tail -5 || true
            find /tmp/kernel_out -type f -exec ls -lh {} \; 2>/dev/null || true
          fi

      - name: Free disk space
        run: |
          rm -f /tmp/ipsw.zip
          df -h /tmp | tail -1

      - name: Analyze AppleJPEGDriver dispatch table
        run: |
          KC=$(find /tmp/kernel_out -name "*kernelcache*" -type f 2>/dev/null | head -1)
          if [ -z "$KC" ]; then KC=$(find /tmp -maxdepth 3 -name "*kernelcache*" -type f 2>/dev/null | head -1); fi
          echo "kernelcache found: $KC"
          if [ -n "$KC" ]; then
            file "$KC"
            cp "$KC" /tmp/kernelcache.raw
            # If still IMG4/compressed, decode it
            FT=$(file -b "$KC")
            echo "file type: $FT"
            if [[ "$FT" == *"Mach-O"* ]]; then
              cp "$KC" /tmp/kernelcache.macho
            else
              echo "[*] Not a plain Mach-O - attempting decompress/decrypt..."
              ipsw kernel dec "$KC" -o /tmp/kernelcache.macho 2>&1 | tail -5 || true
              if [ ! -s /tmp/kernelcache.macho ]; then
                ipsw img4 dec "$KC" -o /tmp/kernelcache.macho 2>&1 | tail -5 || true
              fi
            fi
            if [ -s /tmp/kernelcache.macho ]; then
              file /tmp/kernelcache.macho
              python3 tools/analyze_jpeg_dispatch.py /tmp/kernelcache.macho | tee jpeg_dispatch_analysis.txt
            else
              echo "[-] Could not produce a Mach-O kernelcache"
              exit 1
            fi
          else
            echo "[-] No kernelcache extracted"
            exit 1
          fi

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-analysis
          path: |
            /tmp/kernelcache.macho
            /tmp/kernel_out/
            jpeg_dispatch_analysis.txt
          if-no-files-found: warn

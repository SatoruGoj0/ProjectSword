name: Build IPA

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: brew install ldid

      - name: Build ProjectSword
        run: |
          cd ios18-research/ProjectSword
          make CI=1

      - name: Package IPA
        run: |
          cd ios18-research/ProjectSword
          make ipa CI=1 SIGN=0

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSword-$(echo ${{ github.ref_name }} | sed 's:/:-:g')
          path: ios18-research/ProjectSword/ProjectSword.ipa

      - name: Create Release
        if: github.event.inputs.release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: ProjectSword ${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          files: ios18-research/ProjectSword/ProjectSword.ipa
          make_latest: true
